<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Notas de Luis Tejón</title>
<style>
:root{
  --fondo:#fdfdfb; --texto:#1b1b1f; --tenue:#5f5f6e; --linea:#e2e2dc;
  --tarjeta:#f5f5f1; --acento:#3b5bdb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fondo:#14141a; --texto:#e8e8ea; --tenue:#a0a0b0; --linea:#2c2c36;
    --tarjeta:#1a1a22; --acento:#8aa4f5;
  }
}
:root[data-theme="dark"]{
  --fondo:#14141a; --texto:#e8e8ea; --tenue:#a0a0b0; --linea:#2c2c36;
  --tarjeta:#1a1a22; --acento:#8aa4f5;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--fondo); color:var(--texto);
  font-family:Georgia,"Times New Roman",serif; line-height:1.6;
  display:flex; justify-content:center; padding:clamp(2rem,7vh,5rem) 1.2rem;
}
.envoltorio{width:100%; max-width:44rem}
h1{font-size:2.1rem; margin:0 0 .4rem; line-height:1.15}
.desc{color:var(--tenue); margin:0 0 2.6rem}
.tarjeta{
  display:block; text-decoration:none; color:inherit;
  background:var(--tarjeta); border:1px solid var(--linea);
  border-radius:9px; padding:1.2rem 1.35rem; margin-bottom:1rem;
  transition:border-color .15s ease, transform .15s ease;
}
.tarjeta:hover{border-color:var(--acento); transform:translateY(-2px)}
.tarjeta h2{margin:0 0 .3rem; font-size:1.25rem; color:var(--acento)}
.tarjeta p{margin:.15rem 0; color:var(--tenue); font-size:.95rem}
.tarjeta .curso{font-size:.84rem}
footer{margin-top:3rem; color:var(--tenue); font-size:.82rem;
  font-family:system-ui,sans-serif; border-top:1px solid var(--linea);
  padding-top:1rem}
</style>
</head>
<body>
<div class="envoltorio">
<h1>Notas de Luis Tejón</h1>
<p class="desc">Lecture notes de los cursos de la maestría.</p>
<a class="tarjeta" href="convexa.html"><h2>Optimización Convexa en Espacios de Hilbert</h2><p>Notas del curso de Mauricio Junca</p><p class="curso">Universidad de los Andes · 2026-20</p></a>
<footer>Estas páginas son públicas pero no indexables.</footer>
</div>
</body>
</html>
